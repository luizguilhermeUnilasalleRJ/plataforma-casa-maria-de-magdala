<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h1>Login do Sistema</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Usuário:</label>
        <input type="text" name="username">

        <br><br>

        <label>Senha:</label>
        <input type="password" name="password">

        <br><br>

        <button type="submit">Entrar</button>
    </form>

</body>
</html>
