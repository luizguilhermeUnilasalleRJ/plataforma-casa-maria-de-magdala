{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Área Restrita</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>


<body>

    <main class="pagina-login">




        <section class="area-login">

            <div class="conteudo-login">



                <div class="indicador"></div>




                <h1>
                    Área Restrita
                </h1>




                <form
                    method="POST"
                    class="formulario-login"
                >


                    {% csrf_token %}



                    <div class="campo">

                        <label for="usuario">
                            Usuário
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="username"
                            autocomplete="username"
                        >

                    </div>




                    <div class="campo">

                        <div class="senha-cabecalho">

                            <label for="senha">
                                Senha
                            </label>

                            <button
                                type="button"
                                class="mostrar-senha"
                            >
                                ◉&nbsp; Esconder
                            </button>

                        </div>


                        <input
                            type="password"
                            id="senha"
                            name="password"
                            autocomplete="current-password"
                        >

                    </div>



                    <button
                        type="submit"
                        class="botao-acessar"
                    >
                        Acessar
                    </button>


                </form>

            </div>

        </section>



        <section class="area-visual">

            <img
                src=""
                alt="alguma coisa"
            >

        </section>


    </main>

</body>

</html>
